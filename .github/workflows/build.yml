name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-5compat-dev ninja-build clangd xvfb xauth xdotool desktop-file-utils
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          qt_prefix="$RUNNER_TEMP/qt"
          mkdir -p "$qt_prefix"
          repository=https://download.qt.io/online/qtsdkrepository/mac_x64/desktop/qt6_6121/qt6_6121
          build=6.12.1-0-202611180803
          suffix=MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z
          curl -fL --retry 3 "$repository/qt.qt6.6121.clang_64/${build}qtbase-$suffix" -o "$RUNNER_TEMP/qtbase.7z"
          curl -fL --retry 3 "$repository/qt.qt6.6121.addons.qt5compat.clang_64/${build}qt5compat-$suffix" -o "$RUNNER_TEMP/qt5compat.7z"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 -c <<'EOF'
          e62976c77ce878b1aa04eac204a5e77eafe08cba7aae7fbf545f00b7df12978c  qtbase.7z
          af6a3e928296e36b285a6b200fe77047a2d286598f2314c604401f3a9d10eae4  qt5compat.7z
          EOF
          )
          tar -xf "$RUNNER_TEMP/qtbase.7z" -C "$qt_prefix"
          tar -xf "$RUNNER_TEMP/qt5compat.7z" -C "$qt_prefix"
          echo "NEBULA_QT_PREFIX=$qt_prefix" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          if [ "$RUNNER_OS" = macOS ]; then
            cmake --preset release -DCMAKE_PREFIX_PATH="$NEBULA_QT_PREFIX" -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"
          else
            cmake --preset release
          fi
      - run: cmake --build --preset release --parallel 3
      - run: ctest --preset release
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Verify Linux installation
        if: runner.os == 'Linux'
        run: |
          cmake --install build/release --prefix "$RUNNER_TEMP/nebula"
          desktop-file-validate "$RUNNER_TEMP/nebula/share/applications/nebula-code.desktop"
          file "$RUNNER_TEMP/nebula/bin/NebulaCode"
      - name: Build and install Ubuntu package
        if: runner.os == 'Linux' && (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        run: |
          sudo apt-get install -y dpkg-dev
          cpack --config build/release/CPackConfig.cmake -G DEB -B "$RUNNER_TEMP/packages"
          package=$(find "$RUNNER_TEMP/packages" -maxdepth 1 -name '*.deb')
          test "$(dpkg-deb -f "$package" Architecture)" = "$(dpkg --print-architecture)"
          sudo apt-get install -y "$package"
          test -x /usr/bin/NebulaCode
      - name: Launch Linux app
        if: runner.os == 'Linux'
        run: |
          app="$RUNNER_TEMP/nebula/bin/NebulaCode"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "${{ github.event_name }}" = release ]; then
            app=/usr/bin/NebulaCode
          fi
          xvfb-run -a bash -euc '
            "$1" "$2" &
            pid=$!
            trap "kill $pid" EXIT
            timeout 20s xdotool search --sync --all --onlyvisible --pid "$pid" --name "README[.]md.*Nebula"
          ' -- "$app" "$PWD/README.md"
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          app=build/release/NebulaCode.app
          test "$(lipo -archs "$app/Contents/MacOS/NebulaCode")" = "${{ matrix.arch }}"
          test -f "$app/Contents/Resources/NebulaCode.icns"
      - name: Package macOS app
        if: runner.os == 'macOS' && (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        run: |
          mkdir -p build/vendor
          curl -fL --retry 3 https://www.scintilla.org/scintilla569.tgz -o build/vendor/scintilla569.tgz
          curl -fL --retry 3 https://www.scintilla.org/lexilla555.tgz -o build/vendor/lexilla555.tgz
          curl -fL --retry 3 https://github.com/lxqt/qtermwidget/releases/download/2.4.0/qtermwidget-2.4.0.tar.xz -o build/vendor/qtermwidget-2.4.0.tar.xz
          qt_sources=https://download.qt.io/official_releases/qt/6.12/6.12.1/submodules
          for module in qtbase qt5compat; do
            archive="$module-everywhere-src-6.12.1.tar.xz"
            curl -fL --retry 3 "$qt_sources/$archive" -o "build/vendor/$archive"
          done
          python3 scripts/package-macos.py --include-qt-sdk-source \
            --macdeployqt "$NEBULA_QT_PREFIX/bin/macdeployqt" --output "$RUNNER_TEMP/packages"
          for source in "$RUNNER_TEMP"/packages/*-source.tar.gz; do
            mv "$source" "${source%-source.tar.gz}-macos-${{ matrix.arch }}-source.tar.gz"
          done
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        with:
          name: packages-${{ runner.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/packages/*.deb
            ${{ runner.temp }}/packages/*.zip
            ${{ runner.temp }}/packages/*-source.tar.gz
          if-no-files-found: error
      - name: Compare against VS Code
        if: runner.os == 'Linux' && github.event_name == 'push'
        run: |
          case "$(uname -m)" in
            x86_64) code_arch=x64 ;;
            aarch64) code_arch=arm64 ;;
          esac
          curl --fail --location --retry 3 "https://update.code.visualstudio.com/latest/linux-deb-$code_arch/stable" -o "$RUNNER_TEMP/vscode.deb"
          sudo apt-get install -y "$RUNNER_TEMP/vscode.deb"
          xvfb-run -a --server-args="-screen 0 1280x800x24" python3 scripts/compare-editors.py \
            "$RUNNER_TEMP/nebula/bin/NebulaCode" /usr/share/code/code | tee "$RUNNER_TEMP/editor-comparison.json"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && github.event_name == 'push'
        with:
          name: editor-comparison-${{ matrix.arch }}
          path: ${{ runner.temp }}/editor-comparison.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: native
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" packages/*
